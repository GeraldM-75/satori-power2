name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: debug
          buildozer_workdir: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: satori-power-apk
          path: bin/*.apk
