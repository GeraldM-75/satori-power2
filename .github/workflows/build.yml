name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip openjdk-17-jdk autoconf automake libtool libltdl-dev pkg-config libffi-dev libssl-dev libstdc++6 aidl

      - name: Install Buildozer
        run: pip install buildozer cython

      - name: Fetch bleak Java sources
        run: |
          git clone --depth 1 https://github.com/hbldh/bleak.git /tmp/bleak
          mkdir -p java
          cp -r /tmp/bleak/bleak/backends/p4android/java/com java/
          
      - name: Build APK
        run: echo y | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: satori-power-apk
          path: bin/*.apk
